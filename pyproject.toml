[project]
name = "open-meteo-mcp"
version = "0.1.0"
description = "MCP server that gives Claude, ChatGPT and other AI agents live weather data from Open-Meteo (no API key)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Szabi" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
]

[project.scripts]
open-meteo-mcp = "open_meteo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
